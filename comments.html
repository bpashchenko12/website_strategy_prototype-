<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All comments · XMTrading Prototype studio</title>
<link rel="stylesheet" href="assets/css/xm.css">
<style>
  body { background: var(--bg); }
  .top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
  .top .in { max-width: 1400px; margin: 0 auto; padding: 0 28px; height: 64px; display: flex; align-items: center; gap: 16px; }
  .top .sub { font-size: 13px; color: var(--mut); padding-left: 16px; border-left: 1px solid var(--line); }
  .top .r { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .me { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; background: var(--soft); border: 0; padding: 5px 12px 5px 5px; border-radius: 999px; font-weight: 500; }
  .me .av { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 28px 90px; }
  h1 { font-size: 34px; letter-spacing: -.02em; line-height: 1.15; }
  .grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 26px; margin-top: 24px; align-items: start; }
  .side { position: sticky; top: 84px; display: grid; gap: 14px; max-height: calc(100vh - 100px); overflow: auto; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .box h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin: 2px 4px 10px; }
  .lb { display: grid; gap: 2px; }
  .lbr { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 0; background: none; text-align: left; width: 100%; }
  .lbr:hover { background: var(--bg); } .lbr.on { background: var(--g-l); }
  .lbr .no { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .lbr .t { font-size: 12.5px; font-weight: 600; line-height: 1.25; } .lbr .t small { display: block; color: var(--mut); font-weight: 400; margin-top: 2px; }
  .lbr .m { text-align: right; font-size: 11.5px; color: var(--ink-2); line-height: 1.5; font-weight: 600; }
  .bar { height: 4px; border-radius: 3px; background: var(--soft); margin-top: 5px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--g); border-radius: 3px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 200px; position: relative; } .search input { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 0 14px 0 40px; font-size: 14px; outline: none; } .search input:focus { border-color: var(--g); } .search svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--mut); }
  .seg { display: inline-flex; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; } .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--mut); } .seg button.on { background: var(--ink); color: #fff; }
  .types { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; } .types button { border: 1.5px solid var(--line-2); background: #fff; border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); } .types button.on { color: #fff; border-color: transparent; }
  .feed { display: grid; gap: 14px; margin-top: 12px; }
  .grp { font-size: 13px; font-weight: 700; margin: 14px 2px -2px; display: flex; gap: 8px; align-items: center; } .grp b { background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 7px; font-size: 11.5px; }
  .th { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; transition: box-shadow .3s, border-color .3s; }
  .th.res { background: #fbfbfb; } .th.res .txtm { opacity: .62; }
  .th.flash { border-color: var(--g); box-shadow: 0 0 0 4px rgba(0, 132, 84, .15); }
  .th .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .ideachip { display: inline-flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 999px; padding: 3px 12px 3px 4px; font-size: 12.5px; font-weight: 600; } .ideachip b { background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .th .hd .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .cm { display: flex; gap: 12px; } .cm + .cm { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .av { width: 36px; height: 36px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .cm .b { flex: 1; min-width: 0; } .cm .nm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; } .cm .nm b { font-weight: 600; } .cm .nm small { color: var(--mut); font-size: 12px; } .cm .nm time { margin-left: auto; color: var(--mut); font-size: 12px; }
  .cm .t { font-size: 14.5px; line-height: 1.6; color: #2b3036; white-space: pre-wrap; word-wrap: break-word; margin-top: 4px; }
  .ctx { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); margin-top: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; } .act button, .act a { border: 0; background: none; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); } .act button:hover, .act a:hover { color: var(--g); } .act .del:hover { color: var(--red); }
  .rep { display: none; gap: 10px; margin: 14px 0 0 48px; } .rep.on { display: flex; }
  .rep textarea { flex: 1; border: 1.5px solid var(--line-2); border-radius: 12px; padding: 10px 12px; resize: none; outline: none; min-height: 44px; font-size: 14px; } .rep textarea:focus { border-color: var(--g); box-shadow: 0 0 0 3px rgba(0, 132, 84, .12); }
  .ty { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 999px; }
  .empty { text-align: center; background: #fff; border: 1px dashed var(--line-2); border-radius: 24px; padding: 60px 24px; }
  .empty h3 { font-size: 20px; margin-bottom: 6px; }
  .mc { width: 100%; }
  .nbox select, .nbox textarea { width: 100%; border: 1.5px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; outline: none; background: #fff; } .nbox textarea { min-height: 110px; resize: vertical; margin-top: 10px; }
  .nbox { padding: 26px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .side { position: relative; top: 0; max-height: none; } .wrap, .top .in { padding-left: 16px; padding-right: 16px; } .top .sub { display: none; } }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="xm-logo" id="logo" href="index.html"></a><span class="sub">Prototype studio · Comments</span>
  <div class="r"><a class="btn btn-outline btn-sm" href="index.html">← Ideas tree</a><button class="me" id="me"></button></div>
</div></div>

<div class="wrap">
  <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
    <div><div class="eyebrow">Feedback hub</div><h1 style="margin-top:6px">All comments</h1><p class="mut" style="margin-top:6px;font-size:14.5px" id="summary"></p></div>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" id="exportBtn">Export CSV</button><button class="btn btn-primary btn-sm" id="newBtn">+ New comment</button></div>
  </div>

  <div class="grid">
    <aside class="side">
      <div class="box"><h4>Ideas · support and comments</h4><div class="lb" id="lb"></div></div>
    </aside>
    <main>
      <div class="tools">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" placeholder="Search comments, names or ideas…"></div>
        <div class="seg" id="stSeg"><button data-s="open" class="on">Open</button><button data-s="resolved">Resolved</button><button data-s="all">All</button></div>
        <div class="seg" id="grSeg"><button data-g="flat" class="on">Latest</button><button data-g="idea">By idea</button></div>
      </div>
      <div class="types" id="types"></div>
      <div class="feed" id="feed"></div>
    </main>
  </div>
</div>

<div class="modal-back" id="newModal"><div class="modal nbox"><button class="x" data-close>×</button><h3 style="font-size:20px;margin-bottom:12px">New comment</h3><select id="nIdea"></select><textarea id="nText" placeholder="Write your feedback…"></textarea><button class="btn btn-primary btn-block" id="nPost" style="margin-top:14px">Post comment</button></div></div>

<script src="assets/js/ideas.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/identity.js"></script>
<script>
(function () {
  var $ = XM.$, esc = XM.esc, IDEAS = XM_IDEAS;
  var TYPES = { comment: 'Comment', question: 'Question', concern: 'Concern', suggestion: 'Suggestion', approve: 'Looks good' };
  var TC = { comment: '#5b6470', question: '#2f62f0', concern: '#d6336c', suggestion: '#8a3fd1', approve: '#008454' };
  var F = { idea: XM.qs('idea') || 'all', type: 'all', status: 'open', group: 'flat', q: '' };
  var openReply = {};
  $('#logo').innerHTML = XM.logo(false);
  function ini(n) { return esc(n.split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase()); }
  function ago(ts) { var s = (Date.now() - ts) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
  function idea(id) { return IDEAS.filter(function (i) { return i.id === id; })[0]; }
  function av(a) { return '<span class="av" style="background:' + esc(a.color || '#5b6470') + '">' + ini(a.name) + '</span>'; }

  function side() {
    var max = 1; IDEAS.forEach(function (i) { max = Math.max(max, XMStore.countFor(i.id) + XMStore.votesFor(i.id)); });
    $('#lb').innerHTML = '<button class="lbr' + (F.idea === 'all' ? ' on' : '') + '" data-i="all"><span class="no" style="background:var(--g)">All</span><span class="t">Everything<small>All ideas</small></span><span class="m">' + XMStore.state.comments.length + ' 💬</span></button>' +
      IDEAS.filter(function (i) { return i.status !== 'skipped'; }).map(function (i) {
        var v = XMStore.votesFor(i.id), c = XMStore.countFor(i.id);
        return '<button class="lbr' + (F.idea === i.id ? ' on' : '') + '" data-i="' + i.id + '"><span class="no">' + i.id + '</span><span class="t">' + esc(i.title) + '<div class="bar"><i style="width:' + ((v + c) / max * 100) + '%"></i></div></span><span class="m">' + v + ' 👍<br>' + c + ' 💬</span></button>';
      }).join('');
  }

  function types() {
    $('#types').innerHTML = ['all'].concat(Object.keys(TYPES)).map(function (k) {
      var on = F.type === k; return '<button data-t="' + k + '" class="' + (on ? 'on' : '') + '" style="' + (on ? 'background:' + (TC[k] || '#1d2024') : '') + '">' + (k === 'all' ? 'All types' : TYPES[k]) + '</button>';
    }).join('');
  }

  function matches(t, all) {
    if (F.idea !== 'all' && t.idea !== F.idea) return false;
    if (F.type !== 'all' && t.type !== F.type) return false;
    if (F.status === 'open' && t.resolved) return false;
    if (F.status === 'resolved' && !t.resolved) return false;
    if (F.q) {
      var q = F.q.toLowerCase(), i = idea(t.idea) || {};
      var hay = [t.text, t.author.name, t.author.role, i.title || ''].concat(all.filter(function (r) { return r.parent === t.id; }).map(function (r) { return r.text + ' ' + r.author.name; })).join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  function cm(c, nums, reply) {
    var me = XMStore.identity, can = me && (me.owner || me.id === c.author.id), i = idea(c.idea) || {};
    var link = i.path ? XM.url(i.path) + '?pin=' + c.id : null;
    return '<div class="cm" data-id="' + c.id + '">' + av(c.author) + '<div class="b"><div class="nm"><b>' + esc(c.author.name) + '</b><small>' + esc(c.author.role) + '</small>' +
      (c.type && c.type !== 'comment' ? '<span class="ty" style="background:' + TC[c.type] + '">' + TYPES[c.type] + '</span>' : '') + '<time>' + ago(c.ts) + '</time></div>' +
      (c.pin && c.pin.label ? '<div class="ctx">📍 On “' + esc(c.pin.label) + '”</div>' : '') +
      '<div class="t txtm">' + esc(c.text) + '</div><div class="act">' +
      (reply ? '' : '<button data-a="reply" data-id="' + c.id + '">↩ Reply</button>') +
      (!reply && link ? '<a href="' + link + '">' + (c.pin ? 'View pin in prototype ↗' : 'Open prototype ↗') + '</a>' : '') +
      (!reply && can ? '<button data-a="resolve" data-id="' + c.id + '" data-v="' + (c.resolved ? 0 : 1) + '">' + (c.resolved ? 'Reopen' : '✓ Resolve') + '</button>' : '') +
      (can ? '<button class="del" data-a="del" data-id="' + c.id + '">Delete</button>' : '') + '</div></div></div>';
  }

  function thread(t, all) {
    var i = idea(t.idea) || { id: t.idea, title: 'Idea ' + t.idea }, reps = all.filter(function (r) { return r.parent === t.id; }).sort(function (a, b) { return a.ts - b.ts; });
    return '<article class="th' + (t.resolved ? ' res' : '') + '" data-th="' + t.id + '"><div class="hd"><a class="ideachip" href="' + (i.path ? i.path : '#') + '"><b>#' + i.id + '</b>' + esc(i.title) + '</a>' + (t.resolved ? '<span class="tag">✓ Resolved</span>' : '') +
      '<div class="right">' + (reps.length ? '<span class="mut" style="font-size:12.5px">' + reps.length + ' repl' + (reps.length > 1 ? 'ies' : 'y') + '</span>' : '') + '</div></div>' +
      cm(t) + reps.map(function (r) { return cm(r, null, true); }).join('') +
      '<div class="rep' + (openReply[t.id] != null ? ' on' : '') + '" data-for="' + t.id + '"><textarea rows="1" placeholder="Write a reply…">' + esc(openReply[t.id] || '') + '</textarea><button class="btn btn-primary btn-sm" data-a="send" data-id="' + t.id + '">Reply</button></div></article>';
  }

  function feed() {
    var all = XMStore.state.comments;
    var tops = all.filter(function (c) { return !c.parent && matches(c, all); }).sort(function (a, b) { return b.ts - a.ts; });
    var total = all.filter(function (c) { return !c.parent; }).length;
    var open = all.filter(function (c) { return !c.parent && !c.resolved; }).length;
    var nRep = all.filter(function (c) { return c.parent; }).length;
    $('#summary').textContent = total + ' thread' + (total === 1 ? '' : 's') + ' · ' + open + ' open · ' + nRep + ' repl' + (nRep === 1 ? 'y' : 'ies');
    if (!total) {
      $('#feed').innerHTML = '<div class="empty"><h3>No comments yet</h3><p class="mut" style="max-width:440px;margin:0 auto 18px">Stakeholders can comment from any prototype or from the tree. You can also load a few sample comments to see how this page looks when it fills up.</p><button class="btn btn-outline" data-a="seed">Load sample comments</button></div>'; return;
    }
    if (!tops.length) { $('#feed').innerHTML = '<div class="empty"><h3>Nothing matches these filters</h3><p class="mut">Try another idea, type or status.</p></div>'; return; }
    var keep = {}; XM.$$('.rep.on textarea').forEach(function (t) { keep[t.closest('.rep').getAttribute('data-for')] = t.value; });
    Object.keys(keep).forEach(function (k) { openReply[k] = keep[k]; });
    if (F.group === 'idea') {
      var h = '';
      IDEAS.forEach(function (i) { var g = tops.filter(function (t) { return t.idea === i.id; }); if (g.length) h += '<div class="grp"><b>#' + i.id + '</b>' + esc(i.title) + '<span class="mut" style="font-weight:500">' + g.length + '</span></div>' + g.map(function (t) { return thread(t, all); }).join(''); });
      $('#feed').innerHTML = h;
    } else $('#feed').innerHTML = tops.map(function (t) { return thread(t, all); }).join('');
  }

  function me() {
    var m = XMStore.identity;
    $('#me').innerHTML = m ? '<span class="av" style="background:' + m.color + ';width:26px;height:26px;font-size:11px">' + ini(m.name) + '</span>' + esc(m.name) + ' · ' + esc(m.role) : '<span class="av" style="background:#9aa1ab;width:26px;height:26px;font-size:11px">?</span>Set your name';
  }
  function all() { side(); types(); feed(); me(); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches && e.target.matches('.rep textarea')) { e.preventDefault(); e.target.closest('.rep').querySelector('[data-a="send"]').click(); }
  });
  document.addEventListener('click', function (e) {
    var i = e.target.closest('[data-i]'); if (i) { F.idea = i.getAttribute('data-i'); all(); return; }
    var t = e.target.closest('[data-t]'); if (t) { F.type = t.getAttribute('data-t'); types(); feed(); return; }
    var s = e.target.closest('[data-s]'); if (s) { F.status = s.getAttribute('data-s'); XM.$$('#stSeg button').forEach(function (b) { b.classList.toggle('on', b === s); }); feed(); return; }
    var g = e.target.closest('[data-g]'); if (g) { F.group = g.getAttribute('data-g'); XM.$$('#grSeg button').forEach(function (b) { b.classList.toggle('on', b === g); }); feed(); return; }
    if (e.target.closest('#me')) { XMIdentity.ensure(true).then(all); return; }
    if (e.target.closest('[data-close]') || e.target === $('#newModal')) { $('#newModal').classList.remove('open'); return; }
    var a = e.target.closest('[data-a]'); if (!a) return;
    var act = a.getAttribute('data-a'), id = a.getAttribute('data-id');
    if (act === 'reply') { var r = $('.rep[data-for="' + id + '"]'); r.classList.toggle('on'); if (r.classList.contains('on')) { openReply[id] = openReply[id] || ''; r.querySelector('textarea').focus(); } else delete openReply[id]; }
    else if (act === 'send') {
      var box = a.closest('.rep'), ta = box.querySelector('textarea'), v = ta.value.trim(); if (!v) return;
      var th = XMStore.state.comments.filter(function (c) { return c.id === id; })[0];
      XMIdentity.ensure().then(function () { ta.value = ''; box.classList.remove('on'); delete openReply[id]; return XMStore.addComment({ idea: th.idea, text: v, type: 'comment', parent: id, pin: null }); }).then(function () { feed(); XM.toast('Reply posted'); });
    }
    else if (act === 'resolve') XMStore.resolve(id, a.getAttribute('data-v') === '1');
    else if (act === 'del') { if (confirm('Delete this comment? Replies to it are removed too.')) XMStore.remove(id); }
    else if (act === 'seed') seed();
  });
  $('#q').addEventListener('input', function (e) { F.q = e.target.value.trim(); feed(); });

  $('#newBtn').addEventListener('click', function () {
    $('#nIdea').innerHTML = IDEAS.filter(function (i) { return i.status !== 'skipped'; }).map(function (i) { return '<option value="' + i.id + '"' + (F.idea === i.id ? ' selected' : '') + '>#' + i.id + ' · ' + esc(i.title) + '</option>'; }).join('');
    $('#newModal').classList.add('open');
  });
  $('#nPost').addEventListener('click', function () {
    var v = $('#nText').value.trim(); if (!v) return;
    XMIdentity.ensure().then(function () { return XMStore.addComment({ idea: $('#nIdea').value, text: v, type: 'comment', parent: null, pin: null }); }).then(function () { $('#nText').value = ''; $('#newModal').classList.remove('open'); XM.toast('Comment posted'); });
  });
  $('#exportBtn').addEventListener('click', function () {
    var rows = [['Idea', 'Title', 'Type', 'Author', 'Role', 'Status', 'Reply to', 'Date', 'Text']];
    XMStore.state.comments.slice().sort(function (a, b) { return a.ts - b.ts; }).forEach(function (c) { var i = idea(c.idea) || {}; rows.push([c.idea, i.title || '', c.type || 'comment', c.author.name, c.author.role, c.parent ? '' : (c.resolved ? 'resolved' : 'open'), c.parent || '', new Date(c.ts).toISOString(), c.text]); });
    var csv = rows.map(function (r) { return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'xm-prototype-comments.csv'; a.click();
  });

  function seed() {
    var now = Date.now(), A = function (n, r, c) { return { id: 'demo-' + n.split(' ')[0].toLowerCase(), name: n, role: r, color: c }; };
    var ceo = A('Hiroshi Mori', 'CEO', '#2f62f0'), cmo = A('Elena Petrova', 'Marketing', '#c26a00'), cto = A('Daniel Weiss', 'Engineering', '#8a3fd1'), cp = A('Priya Nair', 'Compliance', '#d6336c');
    var cs = [
      { id: 'demo1', idea: '01', type: 'suggestion', parent: null, pin: null, author: ceo, ts: now - 7200e3, text: 'Love the block layout. Can we make the platforms block the first thing after the hero? That is what affiliates promise most.' },
      { id: 'demo1r', idea: '01', type: 'comment', parent: 'demo1', pin: null, author: A('Boris Pashchenko', 'Product Manager', '#008454'), ts: now - 5400e3, text: 'Good call. We will test platforms-first against promotions-first in the A/B.' },
      { id: 'demo2', idea: '02', type: 'question', parent: null, pin: null, author: cmo, ts: now - 18000e3, text: 'Does the email field fire the affiliate ID before the user clicks the button, or only after? Matters for attribution.' },
      { id: 'demo3', idea: '03', type: 'concern', parent: null, pin: null, author: cp, ts: now - 26000e3, text: 'Please keep the link expiry short and make sure the code is single-use. Fine with the same-window continue if the session is bound to the device.' },
      { id: 'demo4', idea: '04', type: 'approve', parent: null, pin: null, author: ceo, ts: now - 3600e3, text: 'This is the one I want to see first in the pilot. The cookie inspector makes the logic easy to explain.' },
